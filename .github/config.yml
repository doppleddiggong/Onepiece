# DevLog Automation Configuration
# GitHub Actions 워크플로우 중앙 설정 파일

# GPT 피드백 설정
gpt:
  # Daily DevLog GPT 피드백 사용 여부
  # true: 매일 GPT 피드백 자동 생성 (비용 발생)
  # false: 기본 커밋 로그만 생성 (수동 실행 시에만 GPT 사용 가능)
  daily_enabled: false

  # Weekly Report GPT 회고 사용 여부
  # true: 주간 자동 실행 시 GPT 회고 포함 (권장)
  # false: 기본 통계만 생성
  weekly_enabled: true

# Discord 알림 설정
discord:
  # Discord 알림 사용 여부
  # secret.DISCORD_WEBHOOK_URL이 설정되어 있어야 함
  # 전체 알림 On/Off 스위치
  enabled: true 

  # 회의록 공유 알림 사용 여부
  # 이 값을 false로 하면 회의록 알림만 비활성화됩니다.
  meeting_log_enabled: true

# DevLog 생성 설정
devlog:
  # Daily DevLog 자동 생성 여부
  daily_auto: true

  # Weekly Report 자동 생성 여부
  weekly_auto: true

  # DevLog 디렉토리
  output_dir: "Documents/DevLog"

# 성능 설정
performance:
  # Git log 조회 기간 (시간 단위)
  git_log_hours: 24

  # 주간 리포트 분석 대상 Daily DevLog 최대 개수
  weekly_max_daily_logs: 7

# 알림 메시지 커스터마이징
messages:
  daily_commit_prefix: "📝 DevLog:"
  weekly_commit_prefix: "📊 Weekly:"
  no_commits_message: "No commits today"

# Confluence 자동 업로드 설정
confluence:
  # Confluence 자동 업로드 사용 여부
  enabled: true

  # Confluence 도메인 (atlassian.net)
  domain: "jeonminwoo0625-1762930390335.atlassian.net"

  # Confluence 사용자 이메일
  email: "ju100.bae@gmail.com"

  # Confluence 스페이스 키
  space_key: "KLingo"

  # 업로드 대상 부모 페이지 ID 매핑
  # Documents/Meeting/Daily → CONFLUENCE_PARENT_DAILY
  # Documents/Meeting/Common → CONFLUENCE_PARENT_COMMON
  # Documents/DevLog/Daily → CONFLUENCE_PARENT_UE
  # Documents/DevLog/Weekly → CONFLUENCE_PARENT_UE
  parent_pages:
    daily: "2916376"      # Meeting Daily 페이지
    common: "1900600"     # Meeting Common 페이지
    ue: "1835026"         # UE DevLog 페이지

# Jira 연동 설정
jira:
  # Jira 진척도 자동 삽입 사용 여부
  enabled: true

  # Jira 사이트 도메인 (예: jeonminwoo0625-1762930390335)
  site: "jeonminwoo0625-1762930390335"

  # Jira 계정 이메일
  email: "ju100.bae@gmail.com"

  # 프로젝트 키 (예: UN)
  project: "UN"
