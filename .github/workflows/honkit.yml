name: Generate HonKit

on:
  repository_dispatch:
    types: [honkit-build]
  workflow_dispatch:
    inputs:
      keep_files:
        description: 'Whether to keep existing files in the destination directory on the gh-pages branch. Defaults to true.'
        required: false
        default: 'true'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SUMMARY.md
        run: |
          python .github/scripts/generate_summary.py
          echo "✅ SUMMARY.md has been generated"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HonKit and plugins
        run: |
          npm install -g honkit
          npm install -g gitbook-plugin-theme-comscore
          npm install -g gitbook-plugin-github
          npm install -g gitbook-plugin-collapsible-menu
          npm install -g gitbook-plugin-back-to-top-button
          npm install -g gitbook-plugin-search-plus
          npm install -g gitbook-plugin-expandable-chapters-small
          npm install -g gitbook-plugin-page-toc-button
          npm install -g gitbook-plugin-anchor-navigation-ex
          npm install -g gitbook-plugin-code
          npm install -g gitbook-plugin-alerts
          npm install -g gitbook-plugin-emphasize
          npm install -g gitbook-plugin-klipse
          npm install -g honkit-plugin-mermaid

      - name: Build HonKit
        working-directory: Documents
        run: |
          honkit build

      - name: Prepare HonKit output
        env:
          CLIENT_TRIGGER: ${{ github.event.client_payload.trigger }}
          CLIENT_LATEST_FILE: ${{ github.event.client_payload.latest_file }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p honkit-out
          cp -R Documents/_book/. honkit-out/

          python .github/scripts/write_deployment_metadata.py \
            --output honkit-out/metadata.json \
            --event "$EVENT_NAME" \
            --trigger "${CLIENT_TRIGGER:-}" \
            --latest-file "${CLIENT_LATEST_FILE:-}"

      - name: Set keep_files flag
        id: keep_files_flag
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "keep_files=${{ github.event.client_payload.keep_files || 'true' }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "keep_files=${{ github.event.inputs.keep_files || 'true' }}" >> $GITHUB_OUTPUT
          else
            echo "keep_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: honkit-out
          destination_dir: honkit
          keep_files: ${{ steps.keep_files_flag.outputs.keep_files == 'true' }}
          force_orphan: false

      - name: Summary
        run: |
          echo "✅ HonKit documentation has been built and deployed!"
