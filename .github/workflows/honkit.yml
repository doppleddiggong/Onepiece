name: Generate HonKit

on:
  push:
    branches:
      - main
      - dopple
      - docs
    paths:
      - 'Documents/DevLog/**'
      - 'Planning/**'
      - 'Documents/*.md'
      - 'Documents/book.json'
      - '.github/workflows/honkit.yml'
  repository_dispatch:
    types: [honkit-build]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SUMMARY.md
        run: |
          python .github/scripts/generate_summary.py
          echo "✅ SUMMARY.md has been generated"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HonKit and plugins
        run: |
          npm install -g honkit
          npm install -g gitbook-plugin-theme-comscore
          npm install -g gitbook-plugin-github
          npm install -g gitbook-plugin-collapsible-menu
          npm install -g gitbook-plugin-back-to-top-button
          npm install -g gitbook-plugin-search-plus
          npm install -g gitbook-plugin-expandable-chapters-small
          npm install -g gitbook-plugin-page-toc-button
          npm install -g gitbook-plugin-anchor-navigation-ex
          npm install -g gitbook-plugin-code
          npm install -g gitbook-plugin-alerts
          npm install -g gitbook-plugin-emphasize
          npm install -g gitbook-plugin-klipse
          npm install -g honkit-plugin-mermaid

      - name: Build HonKit
        working-directory: Documents
        run: |
          honkit build

      - name: Prepare HonKit output
        env:
          CLIENT_TRIGGER: ${{ github.event.client_payload.trigger }}
          CLIENT_LATEST_FILE: ${{ github.event.client_payload.latest_file }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p honkit-out
          cp -R Documents/_book/. honkit-out/

          python - <<'PY'
import pathlib
import re

root = pathlib.Path('honkit-out')
extensions = {'.html', '.htm', '.md', '.markdown', '.json'}
patterns = [
    (re.compile(r'href="/(?!honkit/|doxygen/)'), 'href="/honkit/'),
    (re.compile(r'src="/(?!honkit/|doxygen/)'), 'src="/honkit/'),
    (re.compile(r'href="docs/'), 'href="/honkit/'),
    (re.compile(r'src="docs/'), 'src="/honkit/'),
    (re.compile(r'href="(?:\\./|\\../)?docs/'), 'href="/honkit/'),
    (re.compile(r'src="(?:\\./|\\../)?docs/'), 'src="/honkit/'),
]

for path in root.rglob('*'):
    if path.is_file() and path.suffix.lower() in extensions:
        text = path.read_text(encoding='utf-8')
        updated = text
        for pattern, replacement in patterns:
            updated = pattern.sub(replacement, updated)
        if updated != text:
            path.write_text(updated, encoding='utf-8')
PY

          python .github/scripts/write_deployment_metadata.py \
            --output honkit-out/metadata.json \
            --event "$EVENT_NAME" \
            --trigger "${CLIENT_TRIGGER:-}" \
            --latest-file "${CLIENT_LATEST_FILE:-}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: honkit-out
          destination_dir: honkit
          keep_files: true
          force_orphan: false

      - name: Summary
        run: |
          echo "✅ HonKit documentation has been built and deployed!"
