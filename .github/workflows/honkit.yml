name: Generate HonKit

on:
  # 다른 워크플로우(Daily/Weekly/Meeting 등)로부터 빌드 요청을 받을 때만 실행
  repository_dispatch:
    types: [honkit-build]

  # 수동으로 문서를 빌드할 때 사용
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SUMMARY.md
        run: |
          python .github/scripts/generate_summary.py
          echo "✅ SUMMARY.md has been generated"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HonKit and plugins
        run: |
          npm install -g honkit
          npm install -g gitbook-plugin-theme-comscore
          npm install -g gitbook-plugin-github
          npm install -g gitbook-plugin-collapsible-menu
          npm install -g gitbook-plugin-back-to-top-button
          npm install -g gitbook-plugin-search-plus
          npm install -g gitbook-plugin-expandable-chapters-small
          npm install -g gitbook-plugin-page-toc-button
          npm install -g gitbook-plugin-anchor-navigation-ex
          npm install -g gitbook-plugin-code
          npm install -g gitbook-plugin-alerts
          npm install -g gitbook-plugin-emphasize
          npm install -g gitbook-plugin-klipse
          npm install -g honkit-plugin-mermaid

      - name: Build HonKit
        working-directory: Documents
        run: |
          honkit build

      - name: Checkout existing GitHub Pages content
        id: pages-cache
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: ./_site

      - name: Prepare GitHub Pages content
        run: |
          set -euo pipefail
          mkdir -p public

          # Copy existing gh-pages content if available
          if [ -d "_site" ] && [ -n "$(ls -A _site 2>/dev/null)" ]; then
            echo "📋 Preserving existing GitHub Pages content..."
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --exclude '.git' _site/ public/
            else
              cp -R _site/. public/
              rm -rf public/.git
            fi
          else
            echo "⚠️ No existing content found, creating fresh deployment..."
            if [ -f ".github/gh-pages-index.html" ]; then
              cp .github/gh-pages-index.html public/index.html
            fi
          fi

          # Update docs directory (preserve doxygen/ if exists)
          echo "📚 Updating HonKit documentation..."
          rm -rf public/docs
          mkdir -p public/docs
          cp -R Documents/_book/. public/docs/
          
          # Ensure doxygen directory exists
          if [ ! -d "public/doxygen" ]; then
            echo "⚠️ Doxygen docs not found in gh-pages. Doxygen needs to be rebuilt."
          else
            echo "✅ Doxygen docs preserved at public/doxygen/"
          fi

      - name: Write deployment metadata
        env:
          CLIENT_TRIGGER: ${{ github.event.client_payload.trigger }}
          CLIENT_LATEST_FILE: ${{ github.event.client_payload.latest_file }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python .github/scripts/write_deployment_metadata.py \
            --output public/metadata.json \
            --event "$EVENT_NAME" \
            --trigger "${CLIENT_TRIGGER:-}" \
            --latest-file "${CLIENT_LATEST_FILE:-}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "✅ HonKit documentation has been built and deployed!"
          echo "🔗 URL: ${{ steps.deployment.outputs.page_url }}"
