name: Generate Doxygen

on:
  push:
    branches:
      - main
    paths:
      - 'Source/**'
      - 'Doxyfile'
      - '.github/workflows/doxygen.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Source/**'
      - 'Doxyfile'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Prepare Doxyfile for gh-pages layout
        run: |
          mkdir -p build-config
          sed -E 's@^OUTPUT_DIRECTORY\s*=.*@OUTPUT_DIRECTORY = Doxygen@' Doxyfile > build-config/Doxyfile

      - name: Generate Doxygen documentation
        run: doxygen build-config/Doxyfile

      - name: Download Doxygen Awesome CSS
        run: |
          mkdir -p Doxygen/html
          wget https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/main/doxygen-awesome.css -O Doxygen/html/doxygen-awesome.css

      - name: Update documentation links for /doxygen/ base
        run: |
          python - <<'PY'
import pathlib
import re

root = pathlib.Path('Doxygen/html')
extensions = {'.html', '.htm', '.md', '.markdown', '.json'}
patterns = [
    (re.compile(r'href="/(?!honkit/|doxygen/)'), 'href="/doxygen/'),
    (re.compile(r'src="/(?!honkit/|doxygen/)'), 'src="/doxygen/'),
    (re.compile(r'href="docs/'), 'href="/doxygen/'),
    (re.compile(r'src="docs/'), 'src="/doxygen/'),
    (re.compile(r'href="(?:\\./|\\../)?docs/'), 'href="/doxygen/'),
    (re.compile(r'src="(?:\\./|\\../)?docs/'), 'src="/doxygen/'),
]

for path in root.rglob('*'):
    if path.is_file() and path.suffix.lower() in extensions:
        text = path.read_text(encoding='utf-8')
        updated = text
        for pattern, replacement in patterns:
            updated = pattern.sub(replacement, updated)
        if updated != text:
            path.write_text(updated, encoding='utf-8')
PY

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Doxygen/html
          destination_dir: doxygen
          keep_files: true
          force_orphan: false

      - name: Summary
        if: github.event_name == 'push'
        run: |
          echo "✅ Doxygen documentation has been built and deployed!"
