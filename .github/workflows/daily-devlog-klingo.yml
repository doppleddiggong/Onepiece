name: KLingo Daily DevLog

on:
  # 매일 KST 오전 9시 (UTC 00:00)
  schedule:
    - cron: '0 0 * * *'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      date:
        description: '기준 날짜 (YYYY-MM-DD, 비워두면 어제)'
        required: false
        type: string
      branch:
        description: '분석 대상 브랜치 (비워두면 main)'
        required: false
        type: string
        default: 'main'
      use_gpt:
        description: 'GPT 분석 사용'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요 (KLingo가 Git diff 분석)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install KLingo DevLog dependencies
        run: |
          pip install -r .github/scripts/devlog_klingo/requirements.txt

      - name: Load Config
        id: config
        run: |
          # config.yml에서 설정 읽기
          pip install pyyaml
          DAILY_GPT_ENABLED=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['gpt']['daily_enabled'])")
          JIRA_ENABLED=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['enabled'])")
          JIRA_SITE=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['site'])")
          JIRA_EMAIL=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['email'])")
          JIRA_PROJECT=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['project'])")

          echo "daily_gpt_enabled=$DAILY_GPT_ENABLED" >> $GITHUB_OUTPUT
          echo "jira_enabled=$JIRA_ENABLED" >> $GITHUB_OUTPUT
          echo "jira_site=$JIRA_SITE" >> $GITHUB_OUTPUT
          echo "jira_email=$JIRA_EMAIL" >> $GITHUB_OUTPUT
          echo "jira_project=$JIRA_PROJECT" >> $GITHUB_OUTPUT

          # 수동 실행 시 입력값이 우선
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.use_gpt }}" ]; then
            USE_GPT="${{ github.event.inputs.use_gpt }}"
          else
            USE_GPT="$DAILY_GPT_ENABLED"
          fi

          echo "use_gpt=$USE_GPT" >> $GITHUB_OUTPUT
          echo "📋 Config loaded: daily_gpt=$DAILY_GPT_ENABLED, use_gpt=$USE_GPT, jira=$JIRA_ENABLED"

      - name: Get current date and branch
        id: params
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            # 전날 날짜로 설정 (오늘 09:00 실행 시 어제의 작업 내용 수집)
            echo "date=$(TZ=Asia/Seoul date -d 'yesterday' +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

          echo "📅 Date: $(cat $GITHUB_OUTPUT | grep '^date=' | cut -d= -f2)"
          echo "🌿 Branch: $(cat $GITHUB_OUTPUT | grep '^branch=' | cut -d= -f2)"

      - name: Generate Daily DevLog with KLingo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JIRA_URL: https://${{ steps.config.outputs.jira_site }}.atlassian.net
          JIRA_EMAIL: ${{ steps.config.outputs.jira_email }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: ${{ steps.config.outputs.jira_project }}
        run: |
          cd .github/scripts/devlog_klingo

          # 상세 환경 변수 확인
          echo "========================================="
          echo "Environment Variables Debug Info"
          echo "========================================="
          echo "Config from config.yml:"
          echo "  - use_gpt (from config): ${{ steps.config.outputs.use_gpt }}"
          echo "  - jira_enabled: ${{ steps.config.outputs.jira_enabled }}"

          echo ""
          echo "Secrets Status:"
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "  ❌ OPENAI_API_KEY: NOT SET (GPT will be DISABLED)"
          else
            echo "  ✅ OPENAI_API_KEY: SET (length: ${#OPENAI_API_KEY} chars)"
          fi

          if [ -z "$JIRA_TOKEN" ]; then
            echo "  ⚠️  JIRA_API_TOKEN: NOT SET"
          else
            echo "  ✅ JIRA_API_TOKEN: SET"
          fi

          echo ""
          echo "Final GPT Decision:"
          if [ "${{ steps.config.outputs.use_gpt }}" == "true" ] && [ -n "$OPENAI_API_KEY" ]; then
            echo "  ✅ GPT WILL BE USED"
          else
            echo "  ❌ GPT WILL NOT BE USED"
            echo "     Reason: config.use_gpt=${{ steps.config.outputs.use_gpt }}, has_key=$([ -n "$OPENAI_API_KEY" ] && echo true || echo false)"
          fi
          echo "========================================="
          echo ""

          # config.json을 환경 변수로 업데이트
          python3 << 'EOF'
          import json
          import os
          import sys

          print("Python Config Generation Debug:")
          print("-" * 40)

          # 환경 변수 확인
          openai_key = os.getenv('OPENAI_API_KEY', '')
          use_gpt_config = '${{ steps.config.outputs.use_gpt }}' == 'true'
          has_api_key = bool(openai_key.strip())

          print(f"  use_gpt_config: {use_gpt_config}")
          print(f"  has_api_key: {has_api_key}")
          print(f"  OPENAI_API_KEY length: {len(openai_key)}")
          print(f"  OPENAI_API_KEY prefix: {openai_key[:10] if openai_key else '(empty)'}...")

          with open('config.json', 'r', encoding='utf-8') as f:
              config = json.load(f)

          # GPT 설정
          config['use_gpt'] = use_gpt_config and has_api_key
          config['openai_api_key'] = openai_key

          # Jira 설정
          config['jira']['url'] = os.getenv('JIRA_URL', '')
          config['jira']['email'] = os.getenv('JIRA_EMAIL', '')
          config['jira']['token'] = os.getenv('JIRA_TOKEN', '')
          config['jira']['project'] = os.getenv('JIRA_PROJECT', '')

          with open('config_runtime.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, indent=2, ensure_ascii=False)

          print(f"\n✅ Runtime config created:")
          print(f"   - use_gpt: {config['use_gpt']}")
          print(f"   - has_api_key: {has_api_key}")
          print(f"   - api_key_length: {len(config['openai_api_key'])}")
          print("-" * 40)

          if not has_api_key:
              print("\n⚠️  WARNING: OPENAI_API_KEY is empty!")
              print("   GPT analysis will be DISABLED")
              sys.exit(0)  # Continue but warn
          EOF

          # KLingo DevLog 생성
          python devlog_generate.py \
            --date "${{ steps.params.outputs.date }}" \
            --branch "${{ steps.params.outputs.branch }}" \
            --config config_runtime.json

          echo "Daily DevLog generated by KLingo"

      - name: Update SUMMARY.md
        run: |
          if [ -f .github/scripts/generate_summary.py ]; then
            python .github/scripts/generate_summary.py
            echo "✅ SUMMARY.md updated"
          else
            echo "⚠️ generate_summary.py not found, skipping"
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Documents/DevLog/Daily/*.md Documents/DevLog/Daily/*.json Documents/SUMMARY.md || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(devlog): daily devlog ${{ steps.params.outputs.date }} [KLingo]"
          git push origin main

      - name: Trigger HonKit Build
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: honkit-build
          client-payload: '{"ref": "main", "trigger": "daily-update", "latest_file": "Documents/DevLog/Daily/${{ steps.params.outputs.date }}.md"}'

      - name: Trigger Confluence Upload
        if: steps.config.outputs.jira_enabled == 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: confluence-upload
          client-payload: '{"file": "Documents/DevLog/Daily/${{ steps.params.outputs.date }}.md"}'

      - name: Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_DEVLOG: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
        run: |
          if [ -f .github/scripts/devlog/send_discord.py ]; then
            python .github/scripts/devlog/send_discord.py \
              --webhook-url "$DISCORD_WEBHOOK_DEVLOG" \
              --type daily \
              --devlog-file "Documents/DevLog/Daily/${{ steps.params.outputs.date }}.md" \
              --date "${{ steps.params.outputs.date }}" \
              --devlog-url "https://doppleddiggong.github.io/Onepiece/honkit/DevLog/Daily/${{ steps.params.outputs.date }}.html" \
              || echo "⚠️ Discord notification failed (non-critical)"
          else
            echo "⚠️ send_discord.py not found, skipping Discord notification"
          fi

      - name: Summary
        if: always()
        run: |
          echo "✅ KLingo Daily DevLog workflow completed!"
          echo "📅 Date: ${{ steps.params.outputs.date }}"
          echo "🌿 Branch: ${{ steps.params.outputs.branch }}"
          echo "🤖 GPT Enabled: ${{ steps.config.outputs.use_gpt }}"
          echo "📝 File: Documents/DevLog/Daily/${{ steps.params.outputs.date }}.md"
          echo "🔗 URL: https://doppleddiggong.github.io/Onepiece/honkit/DevLog/Daily/${{ steps.params.outputs.date }}.html"
