name: Report Daily

on:
  # 매일 KST 오전 9시 (UTC 00:00)
  schedule:
    - cron: '0 0 * * *'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      date:
        description: '기준 날짜 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        type: string
      use_gpt:
        description: 'GPT 피드백 사용'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r .github/scripts/requirements.txt

      - name: Load Config
        id: config
        run: |
          DAILY_GPT_ENABLED=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['gpt']['daily_enabled'])")
          echo "daily_gpt_enabled=$DAILY_GPT_ENABLED" >> $GITHUB_OUTPUT
          
          # 수동 실행 시 입력값이 config 우선
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.use_gpt }}" ]; then
            USE_GPT="${{ github.event.inputs.use_gpt }}"
          else
            USE_GPT="$DAILY_GPT_ENABLED"
          fi
          
          echo "use_gpt=$USE_GPT" >> $GITHUB_OUTPUT
          echo "📋 Config loaded: daily_gpt=$DAILY_GPT_ENABLED, use_gpt=$USE_GPT"

      - name: Get current date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "today=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            # 전날 날짜로 설정 (오늘 09:00 실행 시 어제의 작업 내용 수집)
            echo "today=$(TZ=Asia/Seoul date -d 'yesterday' +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "branch=main" >> $GITHUB_OUTPUT

      - name: Build Daily DevLog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          GPT_ARG=""
          if [ "${{ steps.config.outputs.use_gpt }}" == "true" ]; then
            GPT_ARG="--use-gpt"
          fi
          python .github/scripts/devlog/build_daily_log.py \
            --date "${{ steps.date.outputs.today }}" \
            --branch "${{ steps.date.outputs.branch }}" \
            $GPT_ARG

      - name: Load Jira Config
        id: jira_config
        run: |
          JIRA_ENABLED=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['enabled'])")
          JIRA_SITE=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['site'])")
          JIRA_EMAIL=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['email'])")
          JIRA_PROJECT=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['jira']['project'])")

          echo "jira_enabled=$JIRA_ENABLED" >> $GITHUB_OUTPUT
          echo "jira_site=$JIRA_SITE" >> $GITHUB_OUTPUT
          echo "jira_email=$JIRA_EMAIL" >> $GITHUB_OUTPUT
          echo "jira_project=$JIRA_PROJECT" >> $GITHUB_OUTPUT

          echo "📋 Jira Config loaded: enabled=$JIRA_ENABLED, project=$JIRA_PROJECT"

      - name: Insert Jira Progress into DevLog
        if: steps.jira_config.outputs.jira_enabled == 'true'
        env:
          JIRA_SITE: ${{ steps.jira_config.outputs.jira_site }}
          JIRA_EMAIL: ${{ steps.jira_config.outputs.jira_email }}
          JIRA_PROJECT: ${{ steps.jira_config.outputs.jira_project }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python .github/scripts/jira/insert_progress.py || echo "⚠️ Jira progress insertion failed (non-critical)"

      - name: Update SUMMARY.md
        run: python .github/scripts/generate_summary.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Documents/DevLog/Daily/*.md Documents/DevLog/Daily/*.json Documents/DevLog/Metrics/*.json Documents/SUMMARY.md || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(devlog): daily devlog ${{ steps.date.outputs.today }}"
          git push origin main

      - name: Trigger HonKit Build
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: honkit-build
          client-payload: '{"ref": "main", "trigger": "daily-update", "latest_file": "Documents/DevLog/Daily/${{ steps.date.outputs.today }}.md"}'
